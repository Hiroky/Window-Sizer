name: Release

# v で始まるタグを push すると、発行ビルドを作って GitHub Release を作成する
#   例: git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (single file, win-x64)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish WindowSizer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=$version -o publish

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "WindowSizer-v$version-win-x64.zip"
          Compress-Archive -Path publish/WindowSizer.exe, README.md -DestinationPath $zip
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" $env:ASSET --title "Window Sizer ${{ github.ref_name }}" --generate-notes
